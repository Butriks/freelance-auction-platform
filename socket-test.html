<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Socket.IO Contract Chat Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 16px;
    }

    .panel {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      margin-right: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    pre {
      background: #111;
      color: #00ff7f;
      padding: 16px;
      border-radius: 8px;
      min-height: 300px;
      white-space: pre-wrap;
      overflow: auto;
    }

    .status {
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <h1>Socket.IO Contract Chat Test</h1>

  <div class="panel">
    <label for="serverUrl">Socket server URL</label>
    <input id="serverUrl" value="http://127.0.0.1:5000" />

    <label for="token">JWT token</label>
    <textarea id="token" placeholder="Вставь сюда CLIENT_TOKEN или FREELANCER_TOKEN"></textarea>

    <label for="contractId">Contract ID</label>
    <input id="contractId" type="number" value="1" />

    <div>
      <button onclick="connectSocket()">Connect</button>
      <button onclick="joinContractRoom()">Join contract room</button>
      <button onclick="leaveContractRoom()">Leave contract room</button>
      <button onclick="disconnectSocket()">Disconnect</button>
      <button onclick="clearLog()">Clear log</button>
    </div>

    <div class="status" id="status">Status: disconnected</div>
  </div>

  <div class="panel">
    <h3>Log</h3>
    <pre id="log"></pre>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    let socket = null;

    function getToken() {
      return document.getElementById("token").value.trim();
    }

    function getServerUrl() {
      return document.getElementById("serverUrl").value.trim();
    }

    function getContractId() {
      return Number(document.getElementById("contractId").value);
    }

    function setStatus(text) {
      document.getElementById("status").textContent = "Status: " + text;
    }

    function log(message, data) {
      const el = document.getElementById("log");
      const time = new Date().toLocaleTimeString();

      let line = `[${time}] ${message}`;

      if (data !== undefined) {
        try {
          line += "\n" + JSON.stringify(data, null, 2);
        } catch (error) {
          line += "\n" + String(data);
        }
      }

      el.textContent += line + "\n\n";
      el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
      document.getElementById("log").textContent = "";
    }

    function connectSocket() {
      const token = getToken();
      const serverUrl = getServerUrl();

      if (!token) {
        log("ERROR", { message: "JWT token is required" });
        return;
      }

      if (socket && socket.connected) {
        log("INFO", { message: "Socket is already connected", socketId: socket.id });
        return;
      }

      socket = io(serverUrl, {
        transports: ["websocket"],
        auth: {
          token: token
        }
      });

      socket.on("connect", () => {
        setStatus("connected: " + socket.id);
        log("connected", { socketId: socket.id });
      });

      socket.on("disconnect", (reason) => {
        setStatus("disconnected");
        log("disconnect", { reason });
      });

      socket.on("connect_error", (error) => {
        setStatus("connect_error");
        log("connect_error", {
          message: error.message,
          description: error.description,
          context: error.context
        });
      });

      socket.on("contract_room_joined", (data) => {
        log("contract_room_joined", data);
      });

      socket.on("contract_room_left", (data) => {
        log("contract_room_left", data);
      });

      socket.on("new_message", (data) => {
        log("new_message", data);
      });

      socket.on("new_bid", (data) => {
        log("new_bid", data);
      });

      socket.on("error", (data) => {
        log("socket_error", data);
      });

      socket.onAny((event, ...args) => {
        log("ANY EVENT: " + event, args);
      });
    }

    function joinContractRoom() {
      if (!socket || !socket.connected) {
        log("ERROR", { message: "Socket is not connected. Click Connect first." });
        return;
      }

      const contractId = getContractId();

      if (!contractId) {
        log("ERROR", { message: "contractId is required" });
        return;
      }

      log("emit join_contract_room", { contractId });

      socket.emit("join_contract_room", { contractId });
    }

    function leaveContractRoom() {
      if (!socket || !socket.connected) {
        log("ERROR", { message: "Socket is not connected." });
        return;
      }

      const contractId = getContractId();

      log("emit leave_contract_room", { contractId });

      socket.emit("leave_contract_room", { contractId });
    }

    function disconnectSocket() {
      if (!socket) {
        log("INFO", { message: "Socket was not created" });
        return;
      }

      socket.disconnect();
      socket = null;
      setStatus("disconnected");
      log("manual disconnect");
    }
  </script>
</body>
</html>
